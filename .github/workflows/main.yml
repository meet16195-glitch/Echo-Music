name: Build MusHub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: ./gradlew assembleUniversalFossDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusHub-App
          path: app/build/outputs/apk/universalFoss/debug/*.apk
